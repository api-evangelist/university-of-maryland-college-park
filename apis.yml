x-coverage:
  state: covered
  reason: covered
  detail: >-
    UMD publishes real institution-operated machine-readable surfaces and they were reached and
    exercised. Confirmed institution-operated: one OpenAPI 3.1.0 contract (UMD Libraries Website Tools,
    13 keyless GET operations, harvested and probed), three live OAI-PMH 2.0 endpoints, an OpenSearch
    1.1 descriptor over the Avalon A/V catalog, IIIF Image and Presentation servers, the university's
    Shibboleth SAML 2.0 metadata as InCommon urn:mace:incommon:umd.edu, and its own ArcGIS Enterprise
    12.1 REST catalog at gis.umd.edu. Three education-regime domain standards are evidenced from live
    protocol responses: oai-pmh, saml and shibboleth. Three limits on this coverage. First, DRUM — UMD's DSpace institutional repository and its DOI surface — served a
    503 maintenance page on every host for the whole review, so its documented REST, OAI-PMH and
    OpenSearch endpoints could not be exercised and no datacite or orcid conformance is claimed. Second,
    the previously catalogued footprint was wrong: the five OpenAPIs and eleven derived artifact sets in
    this repository described umd.io, an independent student-run project on a non-institution domain
    that states it is not the university. They were removed and the relationship re-recorded as tenant.
    Third, the Enterprise GIS is gated: its service catalog enumerates fourteen folders without a
    credential, but every folder returns an ArcGIS error 499 "Token Required" inside an HTTP 200, so no
    layer, schema or record behind it could be read and no contract was saved for it.
  evidence:
  - url: https://api.www.lib.umd.edu/api/libtools/openapi.json
    status: 200
    note: Institution-operated OpenAPI 3.1.0, 13 operations, keyless. Harvested to openapi/_original/.
  - url: https://api.www.lib.umd.edu/api/libtools/mckeldin/availability
    status: 200
    note: Live JSON response, no credential. Captured to examples/.
  - url: https://api.fcrepo.lib.umd.edu/oai/api?verb=Identify
    status: 200
    note: 'OAI-PMH 2.0, repositoryName "UMD Libraries", adminEmail lib-ssdr@umd.edu.'
  - url: https://api.av.lib.umd.edu/oai/api?verb=Identify
    status: 200
    note: 'OAI-PMH 2.0, repositoryName "UMD Libraries", adminEmail lib-dpi@umd.edu.'
  - url: https://archives-api.lib.umd.edu/oai?verb=Identify
    status: 200
    note: 'OAI-PMH 2.0, ArchivesSpace OAI Provider, adminEmail aspace-oai@umd.edu.'
  - url: https://av.lib.umd.edu/catalog/opensearch.xml
    status: 200
    note: OpenSearch 1.1 description document.
  - url: https://shib.idm.umd.edu/idp/shibboleth
    status: 200
    note: 'SAML 2.0 EntityDescriptor, entityID urn:mace:incommon:umd.edu, R&S category, SIRTFI.'
  - url: https://iiif.lib.umd.edu/images/
    status: 200
    note: Cantaloupe 5.0.5 IIIF image server.
  - url: https://iiif.lib.umd.edu/manifests/
    status: 200
    note: Papaya 1.2.0, UMD Libraries' own IIIF Presentation application.
  - url: https://opendata.lib.umd.edu/
    status: 200
    note: UMD Libraries Open Data site — the institution's real developer portal, previously uncatalogued.
  - url: https://gis.umd.edu/arcgis/rest/services?f=json
    status: 200
    note: 'Institution-operated ArcGIS Server 12.1.0; 14 service folders enumerated keyless.'
  - url: https://gis.umd.edu/portal/sharing/rest?f=json
    status: 200
    note: 'ArcGIS Portal 2026.1 on UMD''s own host. Previously uncatalogued.'
  - url: https://gis.umd.edu/arcgis/rest/services/Navigation?f=json
    status: 200
    note: 'HTTP 200 carrying {"error":{"code":499,"message":"Token Required"}} — gated, not dead.'
  - url: https://archive.org/advancedsearch.php?q=collection:(university_maryland_cp)
    status: 200
    note: 'numFound 10,674. Tenth documented UMD Libraries service, previously missing from this profile.'
  - url: https://opendata.umd.edu
    status: 200
    note: 'UMD Data Management and Open Data — university-wide data policy site, distinct from the Libraries''.'
  - url: https://umd.edu/.well-known/security.txt
    status: 404
    note: No security.txt. UMD 404 page returned.
  - url: https://www.umd.edu/llms.txt
    status: 404
    note: No llms.txt on the institutional domain.
  - url: https://drum.lib.umd.edu
    status: 503
    note: Maintenance page for the whole DRUM host throughout the review.
  - url: https://api.drum.lib.umd.edu/server/api
    status: 404
    note: Documented DSpace REST base returned a bare 404 while DRUM was down.
  - url: https://umd.io
    status: 200
    note: 'Student-run project; states "we aren''t the school". Reclassified from institution to tenant.'
  - url: https://data.umd.edu
    status: 200
    note: Not an open-data portal. It is the UMD Data Science undergraduate minor site. Not catalogued.
  - url: https://status.umd.edu
    status: 0
    note: No public status page; TLS handshake fails.
