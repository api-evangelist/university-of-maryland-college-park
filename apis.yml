- aid: university-of-maryland-college-park:enterprise-gis
  name: UMD Enterprise GIS — ArcGIS REST Services
  description: >-
    The university's own ArcGIS Enterprise deployment — ArcGIS Server 12.1.0 and Portal 2026.1 at
    gis.umd.edu — and the machine-readable backend behind the official campus map at maps.umd.edu.
    The service catalog root, the server info document and the portal REST endpoint all answer
    keyless JSON; the fourteen service folders beneath them (Navigation, Utilities, UtilityNetworks,
    InteriorSpace, PlanningAndConstruction, AssetInventories, SnowCommandPortal, DIT, ESSR, OEMBC,
    POC, Layers, Print, UtilitySystems) return HTTP 200 carrying an ArcGIS error 499 "Token Required",
