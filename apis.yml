- aid: university-of-maryland-college-park:umd-io
  name: umd.io — student-run University of Maryland data API
  description: >-
    A read-only REST API over UMD course, section, professor, campus bus, building/map and major data,
    covering ground the university itself does not expose programmatically. It is not UMD's. The project
    states "we aren't the school, and we aren't a corporation" and describes itself as built by students,
    for students; umd.io is registered through NameCheap with DNS and hosting on DigitalOcean, the
    contract's contact is hi@umd.io, and the code is MIT-licensed at github.com/umdio. The university
    neither operates nor endorses it, and its course data is scraped from Testudo rather than supplied.
    Recorded as a tenant-class relationship: the data described is UMD's, the contract is not. Its
    OpenAPI and the eleven artifacts derived from it were removed from this repository on 2026-08-30
    because they were being scored as UMD's engineering.
  humanURL: https://umd.io
  baseURL: https://api.umd.io/v1
  x-operator: tenant
  x-operator-evidence: >-
    Registrable domain umd.io is not the institution's; WHOIS shows a NameCheap registration on
    DigitalOcean nameservers; info.contact is hi@umd.io; the project explicitly disclaims being the
    university. Not endorsed, so tenant is the ceiling under the university pipeline's operator axis.
