---
aid: university-of-maryland-college-park
name: University of Maryland College Park
description: >-
  The University of Maryland, College Park (UMD) is the flagship public research university of the
  University System of Maryland and the state's original 1862 land-grant institution. UMD operates no
  central developer portal and publishes no university-wide API programme. Its entire confirmed
  programmable footprint is run by three offices. UMD Libraries publish an Open Data site at
  opendata.lib.umd.edu documenting the interfaces they operate: a keyless FastAPI service for library
  hours and bookable-space availability, three live OAI-PMH 2.0 endpoints over digital collections,
  audio/video collections and ArchivesSpace finding aids, an OpenSearch descriptor over the Avalon A/V
  catalog, and IIIF Image and Presentation servers. The Division of IT operates the university's
  Shibboleth identity provider, which publishes SAML 2.0 metadata as InCommon entity
  urn:mace:incommon:umd.edu with the Research and Scholarship category and SIRTFI assurance — the most
  consequential machine-readable contract UMD runs, and one no vendor catalogues. The campus GIS office
  runs an ArcGIS Enterprise 12.1 deployment at gis.umd.edu whose REST service catalog, server info and
  portal endpoints answer keyless JSON while the fourteen service folders beneath them require a token —
  the machine-readable backend of the official campus map, and undocumented outside the map itself.
  Everything else that
  looks like a UMD API is somebody else's engineering. umd.io, the widely cited course, bus and
  campus-map API, is a student-run independent project on a NameCheap-registered .io domain hosted at
  DigitalOcean that states plainly it is not the school; the library discovery layer is Ex Libris Primo
  through the USMAI consortium; the LMS is Instructure Canvas; web archiving is Archive-It; the
  open-data repository referral is Dryad. Those are recorded here as tenant relationships, not as UMD's
  contracts. The DRUM institutional repository is genuinely UMD-operated and was serving a maintenance
  page across every one of its hosts throughout this review.
