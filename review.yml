  summary: >-
    Re-profiled under the university pipeline, which settles WHO OPERATES each surface before saving any
    contract. The June 2026 profile was wrong at its centre: all five OpenAPIs and the eleven derived
    artifact sets in this repository described umd.io, an independent student-run project on a
    NameCheap-registered .io domain hosted at DigitalOcean whose own site states "we aren't the school,
    and we aren't a corporation". UMD neither operates nor endorses it. Those artifacts were removed file
    by file and the relationship re-recorded as a single tenant-class entry. In their place, real
    institution-operated surfaces were found on umd.edu hosts, none of which had been catalogued: UMD
    Libraries run an Open Data developer portal at opendata.lib.umd.edu documenting a keyless OpenAPI
    3.1.0 service for library hours and space availability, three live OAI-PMH 2.0 endpoints, an
    OpenSearch 1.1 descriptor, and IIIF Image and Presentation servers; and the Division of IT publishes
    SAML 2.0 metadata as InCommon entity urn:mace:incommon:umd.edu with Research and Scholarship category
    and SIRTFI assurance. Three education-regime domain standards are now evidenced from live protocol
    responses rather than from prose: oai-pmh, saml, shibboleth. DRUM, the DSpace institutional
    repository, was down for maintenance across every host for the whole review, so no DataCite or ORCID
    conformance is claimed. A second pass the same day found two further surfaces the first had missed.
    The university runs its own ArcGIS Enterprise 12.1 at gis.umd.edu — the machine-readable backend of
    the official campus map — whose REST service catalog, server info and portal endpoints answer keyless
    JSON while all fourteen service folders return an ArcGIS error 499 "Token Required" inside an HTTP
    200; it is recorded as an institution-operated but gated surface, and the 499-in-200 shape is written
    into errors/ because grading it on status codes alone would score fourteen closed folders as open.
    The Internet Archive collection university_maryland_cp — the tenth of ten services UMD Libraries
    document and the only one absent from this profile — is recorded as tenant. The authentication and
    scopes artifacts were corrected: both had asserted that every institution-operated surface is keyless,
    which the GIS finding makes false. Expect the composite to move on substance, not volume: artifact
    count fell while first-party, verifiable surface area rose.
