reviews:
  - date: '2026-06-03'
    rating: 3
    summary: >-
      UMD has no central official public developer portal. The strongest
      confirmed, documented programmatic footprint is umd.io, a student-run
      open-source REST API at api.umd.io/v1 (verified live, 200) covering
      courses, sections, professors, bus, map/buildings, and majors with docs at
      beta.umd.io (200). The Registrar's Testudo Schedule of Classes is a public
      web app (200) but not a documented JSON API. The DRUM DSpace repository is
      publicly browsable (200) though standard OAI-PMH/REST endpoint paths
      returned 404. Identity SSO (Shibboleth) and a status page were probed but
      are not public APIs. No endpoints were fabricated; only confirmed URLs are
      cataloged.
