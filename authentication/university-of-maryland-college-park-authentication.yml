description: >-
  Authentication posture of the surfaces the University of Maryland actually operates itself.
  Every institution-operated library and repository read surface confirmed in this profile is open
  and keyless. The one exception is the campus Enterprise GIS, which publishes its service catalog
  without a credential and gates every service behind an ArcGIS token. Beyond that, the institution's
  authentication engineering is concentrated in its SAML identity provider, which authenticates
  people into vendor platforms rather than authorising API clients.
