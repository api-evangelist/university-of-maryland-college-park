vocabulary:
  name: umd.io API Vocabulary
  description: >-
    Controlled vocabulary of the core terms used by the umd.io API, the
    student-run open-source REST API for University of Maryland, College Park
    data (courses, sections, professors, majors, campus map buildings, and
    Shuttle-UM bus routes). Definitions are drawn from the umd.io OpenAPI
    description.
  version: "1.0.0"
  terms:
    - term: course
      definition: A University of Maryland course as scraped from the Testudo Schedule of Classes, identified by a course_id.
      tags: [courses]
    - term: course_id
      definition: Unique course identifier — a four-letter department code followed by a three-digit number and an optional trailing letter (e.g. MATH140).
      tags: [courses, identifier]
    - term: section
      definition: A single scheduled offering of a course, identified by a section_id (course_id plus a four-digit section number).
      tags: [courses, sections]
    - term: section_id
      definition: Unique section identifier of the form DEPTNNN-XXXX (e.g. ENGL101-0101).
      tags: [sections, identifier]
    - term: meeting
      definition: A scheduled meeting of a section, with days, room, building, class type, and start/end times.
      tags: [sections, schedule]
    - term: semester
      definition: A numeric representation of an academic term in YYYYMM format (e.g. 202608).
      tags: [courses, sections, time]
    - term: dept_id
      definition: Four-letter department code (e.g. CMSC, MATH) that prefixes course ids.
      tags: [courses, departments]
    - term: gen_ed
      definition: General Education requirements a course fulfills, expressed as an array of arrays (outer OR, inner AND).
      tags: [courses, requirements]
    - term: core
      definition: Legacy CORE requirements satisfied by a course.
      tags: [courses, requirements]
    - term: professor
      definition: A University of Maryland instructor and the list of courses and semesters they have taught.
      tags: [professors]
    - term: major
      definition: A degree major offered on campus, with its name, college, and home page URL.
      tags: [majors]
    - term: building
      definition: A campus building with a name, optional building code, unique id, and latitude/longitude.
      tags: [map]
    - term: route
      definition: A Shuttle-UM bus route, with stops, directions, map path points, and bounding coordinates. Source data is provided via NextBus.
      tags: [bus]
    - term: stop
      definition: A bus stop with a human-readable stop_id, full title, and latitude/longitude.
      tags: [bus]
    - term: bus_schedule
      definition: A per-day schedule for a bus route, describing scheduled stops and trip arrival times.
      tags: [bus, schedule]
    - term: arrival
      definition: A predicted bus arrival time for a stop on a route, sourced from NextBus.
      tags: [bus, predictions]
